# Build and test CAPS on Linux, Windows and macOS; package the installers; publish them on a release tag (v*).
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libfontconfig1 libice6 libsm6
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Core tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Studio build
        shell: bash
        run: |
          native=build/capi; [ "$RUNNER_OS" = Windows ] && native=build/capi/Release
          dotnet build -c Release studio/CapsStudio/CapsStudio.csproj -p:CapsNativeDir="$PWD/$native"
      - name: Studio self-test
        shell: bash
        run: |
          exe=studio/CapsStudio/bin/Release/net10.0/CapsStudio; [ "$RUNNER_OS" = Windows ] && exe="$exe.exe"
          "$exe" --selftest samples "${RUNNER_TEMP}" | tee selftest.log
          grep -q "all checks passed" selftest.log

  package-linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: sudo apt-get update && sudo apt-get install -y zlib1g-dev libfontconfig1 libice6 libsm6 file
      - run: packaging/linux/build.sh x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: caps-linux-x86_64
          path: dist/*

  package-windows:
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - run: pwsh packaging/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: caps-windows-x64
          path: dist/*

  package-macos:
    needs: test
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: packaging/macos/build_dmg.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: caps-macos-${{ matrix.arch }}
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package-linux, package-windows, package-macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "CAPS ${GITHUB_REF_NAME#v}" --generate-notes
