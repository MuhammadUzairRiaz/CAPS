# Build and test CAPS on Linux, Windows and macOS; package the installers; publish them on a release tag (v*).
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# a newer push to the same branch replaces a run still in progress (release tags always finish)
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev gfortran libfontconfig1 libice6 libsm6
      - name: Fortran (macOS)
        if: runner.os == 'macOS'
        run: |
          brew list gcc >/dev/null 2>&1 || brew install gcc
          echo "FC=$(ls $(brew --prefix)/bin/gfortran-* | sort -V | tail -1)" >> "$GITHUB_ENV"
      # Windows: the native core with MinGW-w64 (UCRT64: gcc, g++, gfortran); .NET loads caps.dll through the C ABI
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-gcc-fortran mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
      - name: Native core (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
      - name: Configure
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        if: runner.os != 'Windows'
        run: cmake --build build --config Release --parallel
      - name: Core tests
        if: runner.os != 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Studio build
        shell: bash
        run: dotnet build -c Release studio/CapsStudio/CapsStudio.csproj -p:CapsNativeDir="$PWD/build/capi"
      - name: Studio self-test
        shell: bash
        run: |
          exe=studio/CapsStudio/bin/Release/net10.0/CapsStudio; [ "$RUNNER_OS" = Windows ] && exe="$exe.exe"
          "$exe" --selftest samples "${RUNNER_TEMP}" | tee selftest.log
          grep -q "all checks passed" selftest.log

  package-linux:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: sudo apt-get update && sudo apt-get install -y zlib1g-dev gfortran libfontconfig1 libice6 libsm6 file
      - run: packaging/linux/build.sh x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: caps-linux-x86_64
          path: dist/*

  package-windows:
    needs: test
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-gcc-fortran mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja
      - name: Native core (MinGW-w64)
        shell: msys2 {0}
        run: |
          cmake -S . -B build-pkg/native -G Ninja -DCMAKE_BUILD_TYPE=Release -DCAPS_BUILD_TESTS=OFF
          cmake --build build-pkg/native --parallel
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - run: pwsh packaging/windows/build.ps1 -Native build-pkg/native
      - uses: actions/upload-artifact@v4
        with:
          name: caps-windows-x64
          path: dist/*

  package-macos:
    needs: test
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Fortran
        run: |
          brew list gcc >/dev/null 2>&1 || brew install gcc
          echo "FC=$(ls $(brew --prefix)/bin/gfortran-* | sort -V | tail -1)" >> "$GITHUB_ENV"
      - run: packaging/macos/build_dmg.sh ${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: caps-macos-${{ matrix.arch }}
          path: dist/*.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package-linux, package-windows, package-macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "CAPS ${GITHUB_REF_NAME#v}" --generate-notes
